# Tooling configuration only - the add-on itself has no Python dependencies besides Blender.
[tool.ruff]
line-length = 120
target-version = "py311"  # Blender 4.2 ships Python 3.11
extend-exclude = ["dist", "build", "website"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E741",   # ambiguous variable names are fine in short geometry code
  "SIM108", # ternaries do not always read better
  "UP007",  # keep Optional[] for readability
  "B905",   # zip(strict=) is noise here
  "SIM105", # try/except/pass is idiomatic around bpy calls that may fail
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]        # sys.path setup before imports

[tool.ruff.format]
quote-style = "preserve"
